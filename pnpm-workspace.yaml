packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - esbuild
  - "@biomejs/biome"
  - "@tailwindcss/oxide"
  - sharp
# Single source of truth for versions shared across workspace packages. Depend
# on these with `"<name>": "catalog:"` so every app and package resolves to the
# exact same version and upgrades happen in one place.
#
# Rule of thumb: if a package is (or is likely to be) installed by more than one
# app or package, catalog it. Root-only repo tooling (turbo, husky) and
# package-internal deps (clsx, tailwind-merge) stay pinned where they are used.
catalog:
  "@biomejs/biome": 2.5.9
  "@sanity/vision": 6.9.2
  "@tailwindcss/postcss": 4.3.3
  "@types/node": 26.2.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  better-auth: 1.7.0
  next: 16.3.1
  next-sanity: 13.3.3
  react: 19.2.8
  react-dom: 19.2.8
  sanity: 6.9.2
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vitest: 4.1.10
  zod: 4.4.3
# Peer *ranges* are a compatibility contract, not an install, so they must stay
# permissive — pinning them to the exact versions above would wrongly narrow
# what a consuming app may supply. Reference these with `"catalog:peer"`.
catalogs:
  peer:
    react: ^19.2.0
    react-dom: ^19.2.0
    tailwindcss: ^4.3.0
